<body>

<div id="game">

    <div id="sky"></div>
    <div id="grid"></div>
    <div class="glow one"></div>
    <div class="glow two"></div>

    <div id="hud">
        <div id="logo">NEON DASH</div>

        <div class="hudBox">
            <div class="hudLabel">SCORE</div>
            <div class="hudValue" id="score">0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">COMBO</div>
            <div class="hudValue" id="combo">x1</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">SPEED</div>

        </div>
    </div>

        <div id="progress"></div>
    </div>

    <div id="status">SPACE / W / ↑ = JUMP • A/D = DASH</div>

    <div id="world">
        <div id="ground"></div>
    </div>

    <div id="player"></div>

    <div id="flash"></div>

    <div class="overlay" id="startScreen">
        <div class="panel">
            <h1>NEON DASH</h1>
            <p>
                Run. Jump. Double jump.<br>
                Dodge the hazards and survive the speed.
            </p>
            <button class="bigButton" id="startBtn">START RUN</button>
        </div>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
        <div class="panel">
            <h1>CRASHED</h1>
            <div id="gameOverScore">SCORE: 0</div>
            <p>
                Press R or restart to run again.
            </p>
            <button class="bigButton" id="restartBtn">RESTART</button>
        </div>
    </div>

</div>

<script>
const game = document.getElementById("game");
const world = document.getElementById("world");
const player = document.getElementById("player");

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const speedEl = document.getElementById("speedText");
const progressEl = document.getElementById("progress");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const gameOverScore = document.getElementById("gameOverScore");
const flash = document.getElementById("flash");

let running = false;
let dead = false;

let cameraX = 0;
let nextSpawnX = 0;

let speed = 8;
const maxSpeed = 16;

let distance = 0;
let score = 0;
let combo = 1;

let y = 0;
let velocityY = 0;

const gravity = 0.82;
const jumpPower = 15.3;

let jumpsUsed = 0;
const maxJumps = 2;

let dashTimer = 0;
let dashCooldown = 0;

let previousBottom = 0;

let objects = [];

const PLAYER_W = 45;
const PLAYER_H = 45;
const PLAYER_SCREEN_X = 0.16;
const GROUND_HEIGHT = 76;

function playerWorldX(){
    return cameraX + window.innerWidth * PLAYER_SCREEN_X;
}

function playerWorldLeft(){
    return playerWorldX();
}

function playerWorldRight(){
    return playerWorldLeft() + PLAYER_W;
}

function playerWorldBottom(){
    return GROUND_HEIGHT + y;
}

function playerWorldTop(){
    return playerWorldBottom() + PLAYER_H;
}

function horizontalOverlap(ax,aw,bx,bw){
    return ax < bx + bw && ax + aw > bx;
}

function verticalOverlap(ay,ah,by,bh){
    return ay < by + bh && ay + ah > by;
}

function createObject(type,x,bottom,width,height){
    const el = document.createElement("div");

    el.className = type;

    el.style.left = x + "px";
    el.style.bottom = bottom + "px";

    if(width) el.style.width = width + "px";
    if(height) el.style.height = height + "px";

    world.appendChild(el);

    const obj = {
        el,
        type,
        x,
        bottom,
        width,
        height,
        collected:false
    };

    objects.push(obj);

    return obj;
}

function createPlatform(x,bottom,width,height){
    return createObject(
        "block",
        x,
        bottom,
        width,
        height
    );
}

function createSpike(x,bottom=76){
    return createObject(
        "spike",
        x,
        bottom,
        42,
        42
    );
}

function createOrb(x,bottom){
    return createObject(
        "orb",
        x,
        bottom,
        22,
        22
    );
}

function clearObjects(){
    for(const obj of objects){
        if(obj.el && obj.el.parentNode){
            obj.el.remove();
        }
    }

    objects = [];
}

function generatePattern(){

    const x = nextSpawnX;

    const pattern = Math.floor(Math.random()*9);

    if(pattern === 0){

        createSpike(x,76);

        createSpike(x+70,76);

        createOrb(x+40,155);

        nextSpawnX += 250;

    }else if(pattern === 1){

        createPlatform(x,76,170,35);

        createSpike(x+75,111);

        createOrb(x+115,190);

        nextSpawnX += 280;

    }else if(pattern === 2){

        createPlatform(x,76,120,35);

        createPlatform(x+185,76,130,35);

        createSpike(x+125,76);

        createOrb(x+210,165);

        nextSpawnX += 360;

    }else if(pattern === 3){

        createSpike(x,76);

        createSpike(x+55,76);

        createSpike(x+110,76);

        createOrb(x+70,190);

        nextSpawnX += 280;

    }else if(pattern === 4){

        createPlatform(x,150,170,35);

        createPlatform(x+220,95,150,35);

        createOrb(x+70,240);

        createOrb(x+275,185);

        nextSpawnX += 430;

    }else if(pattern === 5){

        createPlatform(x,76,260,35);

        createSpike(x+55,111);

        createSpike(x+160,111);

        createSpike(x+210,111);

        nextSpawnX += 350;

    }else if(pattern === 6){

        createPlatform(x,120,150,35);

        createSpike(x+45,155);

        createSpike(x+100,155);

        createOrb(x+70,230);

        nextSpawnX += 300;

    }else if(pattern === 7){

        createSpike(x,76);

        createOrb(x+50,140);

        createSpike(x+110,76);

        createOrb(x+160,180);

        createSpike(x+220,76);

        nextSpawnX += 330;

    }else{

        createPlatform(x,76,100,35);

        createPlatform(x+155,125,100,35);

        createPlatform(x+310,175,100,35);

        createOrb(x+185,210);

        nextSpawnX += 460;
    }
}

function generateAhead(){

    const target = cameraX + window.innerWidth + 1400;

    while(nextSpawnX < target){
        generatePattern();
    }
}

function resetWorld(){

    clearObjects();

    cameraX = 0;

    nextSpawnX = Math.max(
        650,
        window.innerWidth + 250
    );

    world.style.transform =
        "translate3d(0,0,0)";

    generateAhead();
}

function startGame(){

    resetWorld();

    running = true;
    dead = false;

    speed = 8;

    distance = 0;
    score = 0;
    combo = 1;

    y = 0;
    velocityY = 0;

    jumpsUsed = 0;

    dashTimer = 0;
    dashCooldown = 0;

    previousBottom = playerWorldBottom();

    player.style.left =
        (PLAYER_SCREEN_X * 100) + "%";

    player.style.bottom =
        GROUND_HEIGHT + "px";

    player.style.transform =
        "rotate(0deg)";

    player.style.filter = "none";

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    requestAnimationFrame(loop);
}

function jump(){

    if(!running || dead) return;

    if(jumpsUsed < maxJumps){

        velocityY = jumpPower;

        jumpsUsed++;

        combo++;

        if(combo > 20) combo = 20;
    }
}

function dash(){

    if(!running || dead) return;

    if(dashCooldown <= 0){

        dashTimer = 180;
        dashCooldown = 550;

        player.style.filter =
            "brightness(1.8) saturate(1.5) drop-shadow(0 0 20px #00ffff)";
    }
}

function updateDash(dt){

    if(dashTimer > 0){

        dashTimer -= dt;

        player.style.filter =
            "brightness(1.8) saturate(1.5) drop-shadow(0 0 20px #00ffff)";

    }else{

        player.style.filter = "none";
    }

    if(dashCooldown > 0){
        dashCooldown -= dt;
    }
}

function updatePlayer(dt){

    previousBottom = playerWorldBottom();

    velocityY -= gravity * (dt/16.67);

    y += velocityY * (dt/16.67);

    if(y < 0){

        y = 0;
        velocityY = 0;
        jumpsUsed = 0;
    }

    player.style.bottom =
        (GROUND_HEIGHT + y) + "px";

    let rotation =
        Math.max(
            -35,
            Math.min(
                35,
                -velocityY * 3
            )
        );

    player.style.transform =
        "rotate(" + rotation + "deg)";
}

function checkPlatforms(){

    const px = playerWorldLeft();
    const pw = PLAYER_W;

    const currentBottom = playerWorldBottom();
    const currentTop = playerWorldTop();

    let landed = false;

    for(const obj of objects){

        if(obj.type !== "block") continue;

        const platformLeft = obj.x;
        const platformRight = obj.x + obj.width;

        const platformTop =
            obj.bottom + obj.height;

        const horizontal =
            px < platformRight &&
            px + pw > platformLeft;

        if(!horizontal) continue;

        /*
            LANDING RULE:

            The player must be falling,
            must have been above the platform,
            and must cross the platform top.

            Landing is ALWAYS SAFE.
        */

        if(
            velocityY <= 0 &&
            previousBottom >= platformTop - 4 &&
            currentBottom <= platformTop + 8
        ){

            y =
                platformTop - GROUND_HEIGHT;

            velocityY = 0;

            jumpsUsed = 0;

            landed = true;

            combo++;

            if(combo > 20) combo = 20;

            break;
        }
    }

    if(landed){
        return;
    }

    /*
        SIDE COLLISION ONLY.

        If the player's body intersects the platform
        without landing on its top, it can hurt.

        This prevents the top from ever being lethal.
    */

    for(const obj of objects){

        if(obj.type !== "block") continue;

        const platformLeft = obj.x;
        const platformTop =
            obj.bottom + obj.height;

        const horizontal =
            px < platformLeft + obj.width &&
            px + pw > platformLeft;

        const vertical =
            playerWorldBottom() < platformTop &&
            playerWorldTop() > obj.bottom;

        if(horizontal && vertical){

            const safelyAbove =
                currentBottom >= platformTop - 5;

            if(!safelyAbove){

                die();

                return;
            }
        }
    }
}

function checkSpikes(){

    const px = playerWorldLeft();
    const py = playerWorldBottom();

    const pw = PLAYER_W;
    const ph = PLAYER_H;

    for(const obj of objects){

        if(obj.type !== "spike") continue;

        const sx = obj.x;
        const sy = obj.bottom;
        const sw = obj.width;
        const sh = obj.height;

        const horizontal =
            px < sx + sw &&
            px + pw > sx;

        const vertical =
            py < sy + sh &&
            py + ph > sy;

        if(horizontal && vertical){

            /*
                Spikes are hazards only.
                Platforms above them remain safe.
            */

            die();

            return;
        }
    }
}

function collectOrbs(){

    const px = playerWorldLeft();
    const py = playerWorldBottom();

    for(const obj of objects){

        if(
            obj.type !== "orb" ||
            obj.collected
        ) continue;

        const ox = obj.x;
        const oy = obj.bottom;

        const horizontal =
            px < ox + obj.width &&
            px + PLAYER_W > ox;

        const vertical =
            py < oy + obj.height &&
            py + PLAYER_H > oy;

        if(horizontal && vertical){

            obj.collected = true;

            obj.el.style.display = "none";

            score += 100 * combo;

            combo++;

            if(combo > 20) combo = 20;
        }
    }
}

function updateCamera(dt){

    cameraX += speed * (dt/16.67);

    world.style.transform =
        "translate3d(" +
        (-cameraX) +
        "px,0,0)";
}

function updateHUD(){

    scoreEl.textContent =
        Math.floor(score);

    comboEl.textContent =
        "x" + combo;

    speedEl.textContent =
        speed.toFixed(1);

    const progress =
        Math.min(
            100,
            (distance % 5000) / 5000 * 100
        );

    progressEl.style.width =
        progress + "%";
}

function die(){

    if(dead) return;

    dead = true;
    running = false;

    flash.style.opacity = ".8";

    setTimeout(()=>{
        flash.style.opacity = "0";
    },80);

    gameOverScore.textContent =
        "SCORE: " + Math.floor(score);

    gameOverScreen.classList.remove("hidden");
}

function loop(timestamp){

    if(!running || dead) return;

    if(!loop.last){
        loop.last = timestamp;
    }

    let dt =
        Math.min(
            34,
            timestamp - loop.last
        );

    loop.last = timestamp;

    speed +=
        0.0032 * dt;

    if(speed > maxSpeed){
        speed = maxSpeed;
    }

    distance +=
        speed * (dt/16.67);

    score +=
        speed * 0.07 * (dt/16.67);

    updatePlayer(dt);

    updateDash(dt);

    updateCamera(dt);

    generateAhead();

    checkPlatforms();

    if(!dead){
        checkSpikes();
    }

    if(!dead){
        collectOrbs();
    }

    updateHUD();

    if(!dead){
        requestAnimationFrame(loop);
    }
}

window.addEventListener("keydown",(e)=>{

    if(
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
    ){

        e.preventDefault();

        if(!running && !dead){
            startGame();
            return;
        }

        jump();
    }

    if(
        e.code === "ArrowRight" ||
        e.code === "KeyD"
    ){

        e.preventDefault();

        dash();
    }

    if(
        e.code === "ArrowLeft" ||
        e.code === "KeyA"
    ){

        e.preventDefault();

        dash();
    }

    if(
        e.code === "KeyR" &&
        dead
    ){

        startGame();
    }
});

game.addEventListener("pointerdown",(e)=>{

    if(
        e.target === startBtn ||
        e.target === restartBtn
    ){
        return;
    }

    if(running){
        jump();
    }
});

startBtn.addEventListener("click",()=>{
    startGame();
});

restartBtn.addEventListener("click",()=>{
    startGame();
});

window.addEventListener("resize",()=>{

    if(!running){
        resetWorld();
    }
});

resetWorld();
updateHUD();
</script>

</body>
</html>
