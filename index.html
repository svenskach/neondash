<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON DASH</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050511;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 70% 30%,rgba(92,42,180,.25),transparent 30%),
        radial-gradient(circle at 20% 70%,rgba(0,220,255,.14),transparent 30%),
        #050511;
}

#sky{
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:60px 60px;
}

#grid{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:45%;

        linear-gradient(rgba(0,220,255,.09) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,220,255,.09) 1px,transparent 1px);
    background-size:45px 45px;
    transform:perspective(500px) rotateX(58deg) scale(1.5);
    transform-origin:bottom;
    opacity:.5;
}

.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.12;
    pointer-events:none;
}

.glow.one{
    background:#00eaff;
    left:-100px;
    top:20%;
}

.glow.two{
    background:#a000ff;
    right:-100px;

}

#hud{

    top:18px;

.logo{
    font-size:22px;

.hudBox{
    min-width:100px;
    padding:9px 14px;

.hudLabel{

#progressWrap{
    flex:1;
    max-width:400px;

}

#progress{
    width:0%;
    height:100%;

    margin-left:auto;
    color:#00eaff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
}

/* MOVING LEVEL ONLY */
#world{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    overflow:visible;
    transform:translate3d(0,0,0);
    transform-origin:left center;
    pointer-events:none;
    will-change:transform;
}

/*
   PLAYER IS NOW OUTSIDE #world.
   This is the important fix.
   The camera moves #world, but never moves the player.
*/
#player{
    position:absolute;
    left:16%;
    bottom:76px;
    width:45px;
    height:45px;
    z-index:80;
    border-radius:9px;
    background:linear-gradient(135deg,#fff,#00eaff 45%,#8a00ff);
    border:2px solid white;
    box-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff,
        inset 0 0 15px rgba(255,255,255,.8);
    transform-origin:center;
    will-change:transform,bottom;
}

#player::after{
    content:"";
    position:absolute;
    inset:9px;
    border:2px solid rgba(255,255,255,.75);
    border-radius:4px;
}

#ground{
    position:absolute;
    left:-10000px;
    bottom:0;
    width:120000px;
    height:76px;
    background:
        linear-gradient(
            90deg,
            #062b39,
            #101042 30%,
            #35105b 60%,
            #081e38
        );
    border-top:2px solid #00eaff;

        0 -5px 20px rgba(0,234,255,.35),

}

    border-radius:8px;

        0 0 12px rgba(180,0,255,.8),

}

}

.overlay{
    position:absolute;

    backdrop-filter:blur(12px);
}

.panel{
    width:min(520px,90vw);

    border:1px solid rgba(0,234,255,.25);

}

        0 0 10px #00eaff,

}

.controls b{

}

button{
    border:0;

<body>

<div id="game">

    <div id="sky"></div>
    <div id="grid"></div>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div id="hud">

        <div class="logo">NEON DASH</div>

        <div class="hudBox">
            <div class="hudLabel">SCORE</div>
            <div class="hudValue" id="score">0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">COMBO</div>
            <div class="hudValue" id="combo">x1</div>
        </div>

        <div id="progressWrap">
            <div id="progress"></div>
        </div>

        <div id="status">READY</div>

    </div>

    <!-- WORLD MOVES -->
    <div id="world">
        <div id="ground"></div>
    </div>

    <!-- PLAYER DOES NOT MOVE WITH CAMERA -->
    <div id="player"></div>

    <div id="flash"></div>

    <div class="overlay" id="startScreen">

        <div class="panel">

            <h1 class="title">NEON<br>DASH</h1>

            <div class="subtitle">
                SPEED • PRECISION • CHAOS
            </div>

            <div class="controls">
                <b>SPACE / ↑ / W</b> — JUMP<br>
                <b>SPACE ×2</b> — DOUBLE JUMP<br>
                <b>A / ←</b> — DASH LEFT<br>
                <b>D / →</b> — DASH RIGHT<br>
                <b>MOUSE / TOUCH</b> — JUMP
            </div>

            <button id="startBtn">
                START RUN
            </button>

        </div>

    </div>

    <div class="overlay" id="gameOver">

        <div class="panel">

            <h1 class="title">CRASHED</h1>

            <div class="subtitle">
                THE RUN IS OVER
            </div>

            <div class="bigScore">
                SCORE:
                <span id="finalScore">0</span>
            </div>

            <button id="restartBtn">
                RUN AGAIN
            </button>

        </div>

    </div>

</div>

<script>
const game=document.getElementById("game");
const world=document.getElementById("world");
const player=document.getElementById("player");

const scoreEl=document.getElementById("score");
const comboEl=document.getElementById("combo");
const progressEl=document.getElementById("progress");
const statusEl=document.getElementById("status");

const startScreen=document.getElementById("startScreen");
const gameOver=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");
const flash=document.getElementById("flash");

const startBtn=document.getElementById("startBtn");
const restartBtn=document.getElementById("restartBtn");


/* ============================================================
   STATE
   ============================================================ */

let running=false;
let dead=false;

let lastTime=0;

let cameraX=0;
let nextSpawnX=900;

let speed=8;
const maxSpeed=16;

let distance=0;
let score=0;

let combo=1;

let y=0;
let velocityY=0;

const gravity=.82;
const jumpPower=15.3;

let jumpsUsed=0;
const maxJumps=2;

let dashVelocity=0;
let dashTimer=0;
let dashCooldown=0;

const dashPower=18;
const dashDuration=13;
const dashCooldownTime=25;

let rotation=0;

const objects=[];


/* ============================================================
   OBJECTS
   ============================================================ */

function createObject(type,x,bottom,width,height){

    const el=document.createElement("div");

    el.className=type;

    el.style.position="absolute";
    el.style.left=`${x}px`;
    el.style.bottom=`${bottom}px`;
    el.style.width=`${width}px`;
    el.style.height=`${height}px`;

    world.appendChild(el);

    const obj={
        el,
        type,
        x,
        bottom,
        width,
        height,
        collected:false
    };

    objects.push(obj);

    return obj;
}


function createPlatform(
    x,
    width=160,
    height=55,
    bottom=76
){
    return createObject(
        "block",
        x,
        bottom,
        width,
        height
    );
}


function createSpike(x,bottom=76){

    return createObject(
        "spike",
        x,
        bottom,
        42,
        48
    );
}


function createOrb(x,bottom=190){

    return createObject(
        "orb",
        x,
        bottom,
        28,
        28
    );
}


/* ============================================================
   GENERATION
   ============================================================ */

function generatePattern(){

    const startX=nextSpawnX;

    const type=Math.floor(
        Math.random()*8
    );


    if(type===0){

        createPlatform(
            startX,
            230,
            55,
            76
        );

        createOrb(
            startX+100,
            190
        );

        nextSpawnX=startX+320;
    }


    else if(type===1){

        createSpike(startX);

        nextSpawnX=startX+260;
    }


    else if(type===2){

        createSpike(startX);
        createSpike(startX+48);

        nextSpawnX=startX+280;
    }


    else if(type===3){

        createPlatform(
            startX,
            180,
            55,
            76
        );

        createSpike(
            startX+235
        );

        nextSpawnX=startX+430;
    }


    else if(type===4){

        createPlatform(
            startX,
            180,
            55,
            145
        );

        createOrb(
            startX+75,
            245
        );

        nextSpawnX=startX+340;
    }


    else if(type===5){

        createPlatform(
            startX,
            140,
            55,
            76
        );

        createPlatform(
            startX+155,
            140,
            55,
            125
        );

        createPlatform(
            startX+310,
            140,
            55,
            174
        );

        nextSpawnX=startX+500;
    }


    else if(type===6){

        createSpike(startX);

        createPlatform(
            startX+115,
            220,
            55,
            76
        );

        createOrb(
            startX+195,
            190
        );

        nextSpawnX=startX+430;
    }


    else{

        createPlatform(
            startX,
            125,
            55,
            76
        );

        createSpike(
            startX+150
        );

        createPlatform(
            startX+225,
            140,
            55,
            76
        );

        createSpike(
            startX+390
        );

        nextSpawnX=startX+550;
    }


    const minimumGap=Math.max(
        260,
        440-speed*11
    );

    if(
        nextSpawnX<
        startX+minimumGap
    ){
        nextSpawnX=
            startX+minimumGap;
    }
}


function generateAhead(){

    const target=
        cameraX+
        window.innerWidth+
        1200;

    let safety=0;

    while(
        nextSpawnX<target &&
        safety<30
    ){

        generatePattern();
        safety++;
    }
}


/* ============================================================
   CAMERA
   ============================================================ */

function updateCamera(dt){

    cameraX+=speed*dt;

    /*
       ONLY #world moves.
       #player is outside #world,
       so it remains visible.
    */

    world.style.transform=
        `translate3d(${-cameraX}px,0,0)`;
}


/* ============================================================
   PLAYER
   ============================================================ */

function updatePlayer(dt){

    velocityY-=gravity*dt;

    y+=velocityY*dt;

    if(y<=0){

        y=0;
        velocityY=0;
        jumpsUsed=0;
    }

    player.style.bottom=
        `${76+y}px`;

    rotation+=
        velocityY*dt*2.5;

    if(Math.abs(rotation)>360){
        rotation%=360;
    }

    player.style.transform=
        `rotate(${rotation}deg)`;
}


/* ============================================================
   PLATFORM COLLISION
   ============================================================ */

function checkPlatforms(){

    const p=
        player.getBoundingClientRect();

    const playerBottom=p.bottom;
    const playerTop=p.top;

    const previousBottom=
        playerBottom-velocityY;

    for(const obj of objects){

        if(obj.type!=="block")
            continue;

        const r=
            obj.el.getBoundingClientRect();

        const horizontal=
            p.right>r.left+5 &&
            p.left<r.right-5;

        if(!horizontal)
            continue;


        /* LAND ON TOP */

        if(
            velocityY<=0 &&
            previousBottom<=r.top+8 &&
            playerBottom>=r.top
        ){

            /*
               #world is moving,
               #player is not.

               Convert the platform's
               screen position to player Y.
            */

            const worldRect=
                world.getBoundingClientRect();

            const desiredBottom=
                worldRect.bottom-r.top;

            y=
                desiredBottom-76;

            if(y<0)
                y=0;

            velocityY=0;
            jumpsUsed=0;

            player.style.bottom=
                `${76+y}px`;

            return;
        }


        /* SIDE COLLISION */

        const verticalOverlap=
            playerBottom>r.top+8 &&
            playerTop<r.bottom-8;

        if(verticalOverlap){

            die();
            return;
        }
    }
}


/* ============================================================
   SPIKES
   ============================================================ */

function checkSpikes(){

    const p=
        player.getBoundingClientRect();

    for(const obj of objects){

        if(obj.type!=="spike")
            continue;

        const r=
            obj.el.getBoundingClientRect();

        const hit=
            p.right-7>r.left &&
            p.left+7<r.right &&
            p.bottom-5>r.top &&
            p.top+7<r.bottom;

        if(hit){

            die();
            return;
        }
    }
}


/* ============================================================
   ORBS
   ============================================================ */

function collectOrbs(){

    const p=
        player.getBoundingClientRect();

    for(const obj of objects){

        if(
            obj.type!=="orb" ||
            obj.collected
        )
            continue;

        const r=
            obj.el.getBoundingClientRect();

        const hit=
            p.right>r.left &&
            p.left<r.right &&
            p.bottom>r.top &&
            p.top<r.bottom;

        if(hit){

            obj.collected=true;

            obj.el.remove();

            score+=100*combo;

            combo++;

            spawnParticles(
                r.left,
                r.top,
                12
            );
        }
    }
}


/* ============================================================
   PARTICLES
   ============================================================ */

function spawnParticles(
    x,
    yPos,
    amount=8
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const particle=
            document.createElement("div");

        particle.className=
            "particle";

        particle.style.left=
            `${x}px`;

        particle.style.top=
            `${yPos}px`;

        game.appendChild(
            particle
        );

        const angle=
            Math.random()*
            Math.PI*2;

        const power=
            30+
            Math.random()*70;

        const dx=
            Math.cos(angle)*power;

        const dy=
            Math.sin(angle)*power;

        let life=1;

        function animate(){

            life-=.035;

            particle.style.transform=
                `translate(
                    ${dx*(1-life)}px,
                    ${dy*(1-life)}px
                )
                scale(${life})`;

            particle.style.opacity=
                life;

            if(life>0){

                requestAnimationFrame(
                    animate
                );

            }else{

                particle.remove();
            }
        }

        animate();
    }
}


/* ============================================================
   DASH
   ============================================================ */

function dash(direction){

    if(
        !running ||
        dashCooldown>0
    )
        return;

    dashVelocity=
        direction*dashPower;

    dashTimer=
        dashDuration;

    dashCooldown=
        dashCooldownTime;

    statusEl.textContent=
        "DASH";

    spawnParticles(
        player.getBoundingClientRect().left,
        player.getBoundingClientRect().top,
        10
    );
}


function updateDash(dt){

    if(dashCooldown>0){

        dashCooldown-=dt;

        if(dashCooldown<0)
            dashCooldown=0;
    }

    /*
       IMPORTANT:
       Dash is visual only now.

       We do NOT permanently change
       the player's screen position,
       preventing it from disappearing.
    */

    if(dashTimer>0){

        dashTimer-=dt;

        player.style.filter=
            "brightness(1.5) drop-shadow(0 0 15px #00eaff)";

    }else{

        player.style.filter=
            "";
        dashVelocity=0;
    }
}


/* ============================================================
   JUMP
   ============================================================ */

function jump(){

    if(!running)
        return;

    if(
        jumpsUsed<
        maxJumps
    ){

        velocityY=
            jumpPower;

        jumpsUsed++;

        spawnParticles(
            player.getBoundingClientRect().left,
            player.getBoundingClientRect().bottom,
            5
        );
    }
}


/* ============================================================
   RESET
   ============================================================ */

function resetGeneration(){

    for(const obj of objects){

        if(
            obj.el &&
            obj.el.parentNode
        ){
            obj.el.remove();
        }
    }

    objects.length=0;

    cameraX=0;

    /*
       Start the first object
       safely ahead of the player.
    */

    nextSpawnX=
        Math.max(
            650,
            window.innerWidth+250
        );

    world.style.transform=
        "translate3d(0,0,0)";

    generateAhead();
}


/* ============================================================
   START
   ============================================================ */

function startGame(){

    running=true;
    dead=false;

    speed=8;

    distance=0;
    score=0;
    combo=1;

    y=0;
    velocityY=0;

    jumpsUsed=0;

    dashVelocity=0;
    dashTimer=0;
    dashCooldown=0;

    rotation=0;

    player.style.left="16%";
    player.style.bottom="76px";
    player.style.transform="rotate(0deg)";
    player.style.filter="";

    scoreEl.textContent="0";
    comboEl.textContent="x1";
    progressEl.style.width="0%";
    statusEl.textContent="RUNNING";

    startScreen.style.display="none";
    gameOver.style.display="none";

    resetGeneration();

    lastTime=
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* ============================================================
   DEATH
   ============================================================ */

function die(){

    if(
        dead ||
        !running
    )
        return;

    dead=true;
    running=false;

    finalScore.textContent=
        Math.floor(score);

    statusEl.textContent=
        "CRASHED";

    flash.style.opacity=".7";

    setTimeout(()=>{
        flash.style.opacity="0";
    },100);

    spawnParticles(
        player.getBoundingClientRect().left,
        player.getBoundingClientRect().top,
        25
    );

    setTimeout(()=>{
        gameOver.style.display="flex";
    },300);
}


/* ============================================================
   GAME LOOP
   ============================================================ */

function gameLoop(time){

    if(!running)
        return;

    let dt=
        (time-lastTime)/16.6667;

    lastTime=time;

    dt=Math.min(dt,2);

    speed+=.0032*dt;

    speed=Math.min(
        speed,
        maxSpeed
    );

    distance+=speed*dt;

    score+=
        speed*
        dt*
        .08;


    updatePlayer(dt);
    updateDash(dt);
    updateCamera(dt);

    generateAhead();

    checkPlatforms();
    checkSpikes();
    collectOrbs();


    scoreEl.textContent=
        Math.floor(score);

    comboEl.textContent=
        `x${combo}`;

    const progress=
        Math.min(
            100,
            distance/20
        );

    progressEl.style.width=
        `${progress}%`;


    if(speed<10){

        statusEl.textContent=
            "RUNNING";

    }else if(speed<13){

        statusEl.textContent=
            "HYPER";

    }else{

        statusEl.textContent=
            "OVERDRIVE";
    }


    requestAnimationFrame(
        gameLoop
    );
}


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            e.preventDefault();
            jump();
        }


        if(
            e.code==="ArrowRight" ||
            e.code==="KeyD"
        ){

            e.preventDefault();
            dash(1);
        }


        if(
            e.code==="ArrowLeft" ||
            e.code==="KeyA"
        ){

            e.preventDefault();
            dash(-1);
        }


        if(
            e.code==="KeyR" &&
            dead
        ){

            startGame();
        }
    }
);


/* ============================================================
   MOUSE / TOUCH
   ============================================================ */

game.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.target.tagName==="BUTTON"
        )
            return;

        if(running)
            jump();
    }
);


/* ============================================================
   BUTTONS
   ============================================================ */

startBtn.addEventListener(
    "click",
    startGame
);

restartBtn.addEventListener(
    "click",
    startGame
);

   RESIZE
   ============================================================ */

window.addEventListener(
    "resize",
    ()=>{
        if(running)
            generateAhead();
    }
);
